<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Merkle Root</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="site-nav">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">♧</span><span>Merkle <strong>Root</strong></span></a>
  </header>

  <main class="login-container">
    <div class="login-hero">
      <p class="eyebrow">CRYPTOGRAPHIC AUDIT INFRASTRUCTURE</p>
      <h1>Sign in to <em>Merkle Root</em></h1>
    </div>

    <div class="login-grid">
      <div class="login-card">
        <div class="login-card-header">
          <span class="portal-icon">⌁</span>
          <h2>User Portal</h2>
        </div>
        <form id="user-login-form">
          <label>Username
            <input name="username" type="text" placeholder="e.g. alice" autocomplete="off" required>
          </label>
          <label>Password
            <input name="password" type="password" placeholder="••••••" required>
          </label>
          <button class="button button-primary" type="submit">Sign in as User <span>→</span></button>
        </form>
        <p class="demo-hint">Demo: alice / alice123</p>
      </div>

      <div class="login-card">
        <div class="login-card-header">
          <span class="portal-icon">⌘</span>
          <h2>Company Portal</h2>
        </div>
        <form id="company-login-form">
          <label>Username
            <input name="username" type="text" placeholder="e.g. acme" autocomplete="off" required>
          </label>
          <label>Password
            <input name="password" type="password" placeholder="••••••" required>
          </label>
          <button class="button button-primary" type="submit">Sign in as Company <span>→</span></button>
        </form>
        <p class="demo-hint">Demo: acme / acme123</p>
      </div>
    </div>

    <div class="login-divider"><span>or</span></div>
    <a class="public-link" href="public.html">View Public Explorer — no login required <span>→</span></a>
  </main>

  <footer class="site-footer"><span>MERKLE ROOT / AUDIT SYSTEM</span><span>Built for verifiable data</span></footer>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
